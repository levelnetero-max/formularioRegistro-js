<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Interactivo - Registro de Usuario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="contenedor">
    <h1>Registro de Usuario</h1>

    <!-- FORMULARIO -->
    <form id="formularioRegistro">
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej: Diego Cherres">
      </div>

      <div class="campo">
        <label for="edad">Edad</label>
        <input type="number" id="edad" placeholder="Ej: 28">
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="text" id="correo" placeholder="Ej: diego@email.com">
      </div>

      <button type="button" id="btnValidar">Validar y Mostrar</button>
    </form>

    <!-- Aquí se mostrarán los errores -->
    <p id="mensajeError" class="error"></p>

    <!-- SECCIÓN DE RESULTADO (se llena dinámicamente con JS) -->
    <section id="resultado" class="resultado oculto">
      <h2 id="bienvenida"></h2>
      <p id="datoEdad"></p>
      <p id="datoCorreo"></p>
      <p id="datoEstado"></p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
